# El servidor de avisos. Se despliega con `npx wrangler deploy` desde esta
# carpeta; ver docs/AVISOS_PUSH.md.
name = "palacio-avisos"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Cada minuto. El primer checkpoint de R10 son 10 minutos, así que esperar
# cinco sería la mitad del intervalo. Cabe en el plan gratuito porque el cron
# lee el índice con un `get` y no con un `list` (ver src/index.js, D-093).
[triggers]
crons = ["* * * * *"]

# Dónde se guardan las suscripciones. El id lo da `wrangler kv namespace create`.
[[kv_namespaces]]
binding = "AVISOS"
id = "PON_AQUI_EL_ID"

[vars]
# La pública no es secreta: viaja en la app al suscribirse.
VAPID_PUBLIC_KEY = "BM40iJmDCfqmIQfUY-uZiYDU513y7qoxwYR_hhrM3koG1pwiN4yHCbZzXLE5pBvFO15d8R7nYlR6iPvUqiEdaa8"
VAPID_SUBJECT = "mailto:tu-correo@example.com"

# La privada NO va aquí. Se pone con:
#   npx wrangler secret put VAPID_PRIVATE_KEY
