<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/nocturne-b05dafec-65a9-46f7-a005-25140c24ba40/styles.css">
  <script src="_ds/nocturne-b05dafec-65a9-46f7-a005-25140c24ba40/_ds_bundle.js"></script>
  <link rel="stylesheet" href="pc-tokens.css">
</helmet>
<div style="position: relative; width: {{ hit }}px; height: {{ hit }}px; display: grid; place-items: center; opacity: {{ opacity }}; cursor: pointer;" title="{{ label }}" aria-label="{{ label }}" onClick="{{ onTap }}">
  <sc-if value="{{ pulse }}" hint-placeholder-val="{{ false }}">
    <div data-pc-pulse="1" style="position: absolute; width: {{ size }}px; height: {{ size }}px; border-radius: 50%; border: 2px solid var(--state-due); animation: pc-pulse var(--dur-pulse) var(--ease-out) infinite;"></div>
  </sc-if>
  <sc-if value="{{ focus }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; width: {{ ringSize }}px; height: {{ ringSize }}px; border-radius: 50%; box-shadow: 0 0 0 2px var(--text), 0 0 0 6px var(--accent-tint-2);"></div>
  </sc-if>
  <div style="position: relative; width: {{ size }}px; height: {{ size }}px; border-radius: 50%; display: grid; place-items: center; box-sizing: border-box; background: {{ fill }}; border: {{ border }}; box-shadow: {{ shadow }}; color: {{ ink }}; font: 600 {{ fontSize }}px/1 var(--font-ui); font-variant-numeric: tabular-nums;">
    <sc-if value="{{ showNum }}" hint-placeholder-val="{{ true }}"><span>{{ n }}</span></sc-if>
    <sc-if value="{{ star }}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; top: -5px; right: -6px; width: {{ badge }}px; height: {{ badge }}px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; color: var(--state-mastered); font-size: {{ badgeFont }}px; line-height: 1;"><i class="ph-fill ph-star"></i></div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:60,&quot;height&quot;:60},&quot;n&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:5,&quot;tsType&quot;:&quot;number&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;empty&quot;,&quot;new&quot;,&quot;learning&quot;,&quot;due&quot;,&quot;review&quot;,&quot;mastered&quot;,&quot;suspended&quot;],&quot;default&quot;:&quot;due&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:28,&quot;tsType&quot;:&quot;number&quot;},&quot;mini&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;focus&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;dim&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;noPulse&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Hombro derecho&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onTap&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const st = p.state ?? 'new', size = p.size ?? 28, mini = !!p.mini;
    const c = `var(--state-${st})`;
    let fill = c, border = `1.5px solid var(--state-edge)`, shadow = 'none', ink = 'var(--ink-on-state)';
    if (st === 'empty') { fill = 'transparent'; border = `1.5px dashed ${c}`; ink = 'var(--text-3)'; }
    if (st === 'new') { fill = 'var(--bg)'; border = `2px solid ${c}`; ink = 'var(--text)'; }
    if (st === 'learning') shadow = 'inset 0 0 0 3px var(--bg)';
    if (st === 'due') shadow = `0 0 0 2px var(--bg), 0 0 0 3.5px ${c}`;
    if (st === 'suspended') { fill = `repeating-linear-gradient(45deg, ${c} 0 3px, transparent 3px 6px)`; border = `1.5px solid ${c}`; ink = 'var(--text)'; }
    if (p.heat != null) { const h = Math.round(p.heat * 100); fill = `color-mix(in srgb, var(--accent) ${h}%, var(--bg))`; border = '1px solid var(--line-2)'; shadow = 'none'; ink = h > 55 ? 'var(--ink-on-state)' : 'var(--text)'; }
    const names = { empty: 'vacío', new: 'nuevo', learning: 'aprendiendo', due: 'vencido', review: 'al día', mastered: 'dominado', suspended: 'suspendido' };
    return {
      size, hit: Math.max(p.hit ?? 44, size), ringSize: size + 10, fill, border, shadow, ink,
      fontSize: Math.max(8, Math.round(size * 0.45)), showNum: !mini, n: p.n ?? 1,
      pulse: st === 'due' && !p.noPulse, star: st === 'mastered', badge: Math.max(12, Math.round(size * 0.5)), badgeFont: Math.max(8, Math.round(size * 0.34)),
      focus: !!p.focus, opacity: p.dim ? 0.4 : 1,
      label: `${p.label ?? 'Punto'} · ${names[st]}`, onTap: p.onTap
    };
  }
}
</script>
</body>
</html>
